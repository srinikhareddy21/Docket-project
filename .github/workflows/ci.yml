name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  checks:            # no database needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: sh scripts/check-all.sh

  backend-build:     # compiles against the real Spring jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B -f backend/pom.xml verify

  e2e:               # real backend + real MySQL + the black-box API suite
    runs-on: ubuntu-latest
    needs: [checks, backend-build]
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_DATABASE: docket, MYSQL_USER: docket, MYSQL_PASSWORD: ci-only-db-password, MYSQL_ROOT_PASSWORD: ci-only-root-password }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      mailhog:           # catches the password-reset email so the suite can click the real link
        image: mailhog/mailhog
        ports: ["1025:1025", "8025:8025"]
    env:
      DB_HOST: 127.0.0.1
      DB_PASSWORD: ci-only-db-password
      STORAGE_DIR: ${{ runner.temp }}/uploads
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      RATE_LIMIT_IP_MAX: 500      # the suite makes more credential calls than the production limit of 30 per 10 minutes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B -q -f backend/pom.xml package -DskipTests
      - name: Start backend
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          nohup java -jar backend/target/docket-backend-*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/health && exit 0; sleep 2; done
          cat backend.log; exit 1
      - name: Run API end-to-end tests
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_MAILHOG_URL: http://localhost:8025
          E2E_SQL_CMD: mysql -h127.0.0.1 -uroot -pci-only-root-password docket
        run: node --test e2e/
      - if: failure()
        run: tail -n 200 backend.log

  ui:                # real Chromium: layout at 360/768/1280px, focus trap, skip link, shortcuts, reduced motion
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci --no-audit --no-fund && npm run build --silent
      - run: cd frontend && npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: cd frontend && npm run test:ui
