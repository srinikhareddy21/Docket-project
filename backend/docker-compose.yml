# Local development services only. Reads credentials from backend/.env (see .env.example).
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-docket}
      MYSQL_USER: ${DB_USER:-docket}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in backend/.env}
    ports: ["127.0.0.1:3307:3306"]
    volumes: [docket-mysql:/var/lib/mysql]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
  mailhog:   # catches outgoing email locally so you can click password-reset links. Dev only.
    image: mailhog/mailhog
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  docket-mysql:
