spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  config:
    import: optional:file:./.env[.properties]
  application:
    name: docket-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:docket}?serverTimezone=UTC&characterEncoding=utf8&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=${DB_ALLOW_PK_RETRIEVAL:true}
    username: ${DB_USER:docket}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    whitelabel:
      enabled: false

docket:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@docket.local}
  jwt:
    secret: ${JWT_SECRET}
    issuer: docket
  cookie:
    secure: ${COOKIE_SECURE:false}
  auth:
    access-ttl: 15m
    refresh-ttl-remember: 30d
    refresh-ttl-session: 12h
    reset-token-ttl: 30m
  rate-limit:
    ip-max: ${RATE_LIMIT_IP_MAX:30}      # raise only for automated test runs
    ip-window: 10m
    login-failure-max: 5
    login-failure-window: 15m
  applications:
    undo-window: ${UNDO_WINDOW:5m}
    deleted-retention: ${DELETED_RETENTION:30d}
  storage:
    dir: ${STORAGE_DIR:./data/uploads}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google-calendar/callback}
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  extension:
    allowed-origins: ${EXTENSION_ORIGINS:}
